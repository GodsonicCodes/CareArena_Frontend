services:
  - type: web
    name: carearena-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://carearena-mai-3svi.onrender.com
      - key: VITE_WS_BASE_URL
        value: wss://carearena-mai-3svi.onrender.com
      - key: VITE_API_KEY
        sync: false
      - key: VITE_ADMIN_API_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
